name: Rax3000m-Immortalwrt24.10-usboffload-openclash版RAX3000M固件

on:
  push:
    branches:
      - main
    paths:
      - 'rax3000m-openclash.config' # 仅配置文件变动时触发push编译
  workflow_dispatch:               # 支持手动触发

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Workflow Repo
      uses: actions/checkout@v4

    - name: 清理磁盘空间并重新挂载大分区 (Maximize Build Space)
      uses: easimon/maximize-build-space@master
      with:
        build-mount-path: /home/runner/work/openwrt_build
        root-reserve-mb: 5120
        swap-size-mb: 1
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'
        remove-docker-images: 'true'

    - name: 配置虚拟内存 (Enable 4GB Swap)
      run: |
        SWAP_DIR="/home/runner/work/openwrt_build"
        sudo fallocate -l 4G $SWAP_DIR/swapfile || sudo dd if=/dev/zero of=$SWAP_DIR/swapfile bs=1M count=4096
        sudo chmod 600 $SWAP_DIR/swapfile
        sudo mkswap $SWAP_DIR/swapfile
        sudo swapon $SWAP_DIR/swapfile
        free -h

    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
          bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib \
          g++-multilib git gnutls-dev gperf haveged help2man intltool lib32gcc-s1 libc6-dev-i386 libelf-dev \
          libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev libpython3-dev \
          libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano \
          ninja-build p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-docutils \
          python3-pyelftools qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
          upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd rustc cargo

    - name: Clone ImmortalWrt Source
      run: |
        cd /home/runner/work/openwrt_build
        git clone -b 2410 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt
        cd openwrt
        
        # 1. 更新 Feed，但在安装前先行剔除旧版 OpenClash
        ./scripts/feeds update -a
        rm -rf feeds/luci/applications/luci-app-openclash
        rm -rf feeds/packages/net/openclash
        
        # 2. 安装 Feed
        ./scripts/feeds install -a

        # 3. 更新 Golang 环境
        rm -rf feeds/packages/lang/golang
        git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang
        
        # 4. 【关键】在 package 目录下 clone 最新版，并强制删除任何可能存在的冲突
        rm -rf package/luci-app-openclash
        # 使用 --depth=1 获取 master 分支最新代码
        git clone --depth=1 -b master https://github.com/vernesong/OpenClash.git package/luci-app-openclash

        # 5. 拉取 Lucky
        rm -rf package/lucky
        git clone https://github.com/sirpdboy/luci-app-lucky.git package/lucky

    - name: 强制刷新 OpenClash 版本定义
      run: |
        # 进入 OpenClash 目录，强制拉取最新远程变更（双重保险）
        cd /home/runner/work/openwrt_build/openwrt/package/luci-app-openclash
        git fetch --all
        git reset --hard origin/master

    - name: Apply Custom .config & Fix Downloads
      run: |
        cp $GITHUB_WORKSPACE/rax3000m-openclash.config /home/runner/work/openwrt_build/openwrt/.config
        cd /home/runner/work/openwrt_build/openwrt

        # 修复 libxcrypt 链接报错
        sed -i '/^include \$(INCLUDE_DIR)\/package.mk/a TARGET_CFLAGS += -Wno-error=format-nonliteral' feeds/packages/libs/libxcrypt/Makefile

        # 强制跳过 ebtables 的 Hash 校验 (解决你刚才遇到的 Error 128/Hash mismatch)
        if [ -f package/network/utils/ebtables/Makefile ]; then
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/g' package/network/utils/ebtables/Makefile
        fi
        
        make defconfig

        # 循环预下载
        for i in {1..3}; do
          make -j$(nproc) download && break || (echo "Retry download $i..." && sleep 5)
          [ $i -eq 3 ] && make -j1 download
        done

        # 构建工具链
        make toolchain/install -j$(nproc)

    - name: Start Build
      run: |
        cd /home/runner/work/openwrt_build/openwrt
        # 使用 nproc-1 留出内存余量，防止链接大型库时 OOM
        make -j$(($(nproc)-1)) || make -j1 V=s

    - name: Package Firmware
      run: |
        mkdir -p $GITHUB_WORKSPACE/firmware-out
        cd /home/runner/work/openwrt_build/openwrt/bin/targets/mediatek/mt7981/
        find . -maxdepth 1 -type f -exec cp {} $GITHUB_WORKSPACE/firmware-out/ \;
        cp /home/runner/work/openwrt_build/openwrt/.config $GITHUB_WORKSPACE/firmware-out/rax3000m-openclash.config

    - name: Generate Release Tag
      id: tag
      run: echo "tag=immortalwrt-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Upload to GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.tag.outputs.tag }}
        name: "RAX3000M ImmortalWrt-24.10-openclash版固件 - ${{ steps.tag.outputs.tag }}"
        body: |
          📦 RAX3000M 专用固件
          - 系统版本：ImmortalWrt 24.10 
          - 插件集成：openclash lucky samba4 ftp wechatpush
          - 触发方式：${{ github.event_name }}
          ---
          ✅ 文件包含：固件主体(.itb/.bin)、配置清单(.manifest)、完整编译配置(.config)
        files: ${{ github.workspace }}/firmware-out/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}