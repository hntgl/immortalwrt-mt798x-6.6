name: Immortalwrt-24.10-6.6 插件选择版RAX3000M固件编译

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      config_file:
        description: '请选择要使用的配置文件 (.config)'
        required: true
        default: '24.10-6.6-passwall.config'
        type: choice
        options:
          - '24.10-6.6-passwall+openclash.config'
          - '24.10-6.6-passwall2.config'
          - '24.10-6.6-passwall&openclash.config'
          - '24.10-6.6-passwall.config'
          - '24.10-6.6-openclash.config'
          - '24.10-6.6-openclash-test.config'
          - '24.10-6.6-openclash-ksmbd.config'
          - '24.10-6.6-openclash+passwall-ksmbd.config'
          - '24.10-6.6-openclash+passwall2-ksmbd.config'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 极限清理系统环境 (Extreme Cleanup)
        run: |
          # 删除系统预装的庞大软件包，释放根目录空间
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean

      - name: 清理磁盘空间并重新挂载大分区
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /home/runner/work/openwrt_build
          root-reserve-mb: 5120
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 配置虚拟内存 (Enable 4GB Swap) 与 路径重定向
        run: |
          BIG_SPACE="/home/runner/work/openwrt_build"
          
          # 1. 配置 4GB 虚拟内存，防止编译 Rust/LLVM 时内存溢出 (OOM)
          sudo fallocate -l 4G $BIG_SPACE/swapfile || sudo dd if=/dev/zero of=$BIG_SPACE/swapfile bs=1M count=4096
          sudo chmod 600 $BIG_SPACE/swapfile
          sudo mkswap $BIG_SPACE/swapfile
          sudo swapon $BIG_SPACE/swapfile
          
          # 2. 【核心修复】将 /tmp 重定向到大分区，解决 apt 报错
          sudo mkdir -p $BIG_SPACE/tmp
          sudo chmod 1777 $BIG_SPACE/tmp
          sudo mv /tmp /tmp_old && sudo ln -s $BIG_SPACE/tmp /tmp
          
          # 3. 【核心修复】将 apt 缓存重定向到大分区，解决磁盘不足
          sudo mkdir -p $BIG_SPACE/apt_cache/archives
          sudo mv /var/cache/apt/archives /var/cache/apt/archives_old && sudo ln -s $BIG_SPACE/apt_cache/archives /var/cache/apt/archives
          
          free -h

      - name: Install Dependencies & Toolchain fix
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          # 安装编译必需依赖，特别增加了 clang/llvm 以防 rust 404 后无法本地编译
          # 移除了 texlive 等无用大包，增加 python3-setuptools 解决 host 依赖警告
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler ecj fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            lib32gcc-s1 libc6-dev-i386 libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev \
            libmpc-dev libmpfr-dev libncurses-dev libpython3-dev libreadline-dev libssl-dev \
            libtool libyaml-dev libz-dev lld llvm lrzsz mkisofs msmtp nano ninja-build \
            p7zip p7zip-full patch pkgconf python3 python3-pip python3-ply python3-pyelftools \
            python3-setuptools qemu-utils re2c rsync scons squashfs-tools subversion swig \
            texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd rustc cargo

          # 预装系统级 Rust 环境 (方案 A)，辅助 OpenWrt 构建
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clone ImmortalWrt Source
        run: |
          cd /home/runner/work/openwrt_build
          export GIT_TERMINAL_PROMPT=0
          
          # 1. 克隆主源码
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt
          cd openwrt
          
          # 2. 更新基础 Feeds
          ./scripts/feeds update -a
          
          # 3. 【去重优化】移除自带的旧版插件，防止与最新版冲突
          rm -rf feeds/luci/applications/luci-app-openclash
          rm -rf feeds/packages/net/openclash
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          rm -rf feeds/luci/applications/luci-app-passwall
          
          # 4. 安装 Feeds
          ./scripts/feeds install -a

          # 5. 克隆最新版插件 (带重试机制)
          function clone_repo() {
            local url=$1; local path=$2; local branch=${3:-main}
            for i in {1..3}; do
              git clone --depth=1 -b "$branch" "$url" "$path" && return 0 || sleep 5
            done
            return 1
          }

          echo "下载最新版插件..."
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" "package/passwall-packages" "main"
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall.git" "package/passwall-luci" "main"
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall2" "package/passwall2-luci" "main"
          clone_repo "https://github.com/vernesong/OpenClash.git" "package/luci-app-openclash" "master"
          clone_repo "https://github.com/sirpdboy/luci-app-lucky.git" "package/lucky" "main" || clone_repo "https://github.com/sirpdboy/luci-app-lucky.git" "package/lucky" "master"
          
          # 替换 Golang 为最新版 (防止编译失败)
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang

          # 6. 【依赖修复】强行更正 python-setuptools 路径错误
          find feeds/packages -name Makefile -exec sed -i 's/python-setuptools\/host/python3-setuptools\/host/g' {} +
          find feeds/packages -name Makefile -exec sed -i 's/python-pika\/host//g' {} +

      - name: Apply Custom .config & Fix Rust 404
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          SELECTED_CONFIG="${{ github.event.inputs.config_file }}"
          echo "MY_CONFIG_NAME=$SELECTED_CONFIG" >> $GITHUB_ENV
          cp $GITHUB_WORKSPACE/$SELECTED_CONFIG .config
          
          # 【核心修复】禁止 Rust 尝试从失效的 CI 链接下载 LLVM，解决 404 报错
          find feeds/packages/lang/rust -name "*.toml" -exec sed -i 's/download-ci-llvm = true/download-ci-llvm = false/g' {} + || true
          
          # 修复 libxcrypt 等小报错
          sed -i '/^include \$(INCLUDE_DIR)\/package.mk/a TARGET_CFLAGS += -Wno-error=format-nonliteral' feeds/packages/libs/libxcrypt/Makefile || true
          
          make defconfig
          # 下载源码包 (增加重试)
          for i in {1..3}; do make -j$(nproc) download && break || sleep 5; done

      - name: Build Toolchain
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          # 优先编译工具链
          make toolchain/install -j$(nproc)

      - name: Start Build
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          # 全速编译，若失败则切换到单线程模式查看详细错误日志
          make -j$(nproc) || make -j1 V=s

      - name: Package Firmware
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware-out
          cd /home/runner/work/openwrt_build/openwrt/bin/targets/mediatek/filogic/
          find . -maxdepth 1 -type f -exec cp {} $GITHUB_WORKSPACE/firmware-out/ \;
          cp /home/runner/work/openwrt_build/openwrt/.config $GITHUB_WORKSPACE/firmware-out/${{ env.MY_CONFIG_NAME }}

      - name: Generate Tag
        id: tag
        run: echo "tag=immortalwrt-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "RAX3000M [${{ env.MY_CONFIG_NAME }}] - ${{ steps.tag.outputs.tag }}"
          body: |
            设备: 亚瑟 RAX3000M (MT7981)
            源码: Padavanonly/ImmortalWrt-mt798x-24.10-6.6
            内核: 6.6
            配置文件: ${{ env.MY_CONFIG_NAME }}
            修复: Rust 404 下载错误 / Python 依赖警告 / 磁盘空间重映射
          files: ${{ github.workspace }}/firmware-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
