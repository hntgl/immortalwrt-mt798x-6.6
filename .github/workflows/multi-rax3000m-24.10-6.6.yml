name: Immortalwrt-24.10-6.6 插件选择版RAX3000M固件编译

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      config_file:
        description: '请选择要使用的配置文件 (.config)'
        required: true
        default: '24.10-6.6-passwall.config'
        type: choice
        options:
          - '24.10-6.6-passwall+openclash.config'
          - '24.10-6.6-passwall2.config'
          - '24.10-6.6-passwall&openclash.config'
          - '24.10-6.6-passwall.config'
          - '24.10-6.6-openclash.config'
          - '24.10-6.6-openclash-test.config'
          - '24.10-6.6-openclash-ksmbd.config'
          - '24.10-6.6-openclash+passwall-ksmbd.config'
          - '24.10-6.6-openclash+passwall2-ksmbd.config'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      # 1. 磁盘扩容 (保持你的配置，但禁用自带 Swap 以便后续手动创建更大的)
      - name: 极限清理系统环境 & 扩容
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /home/runner/work/openwrt_build
          root-reserve-mb: 5120
          swap-size-mb: 1  # 设置为 1 禁用默认，我们在下一步手动创建
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      # 2. 手动创建 12GB Swap (解决 Rust 编译 OOM 内存溢出)
      - name: 配置虚拟内存 (12GB Swap)
        run: |
          BIG_SPACE="/home/runner/work/openwrt_build"
          mkdir -p $BIG_SPACE
          # 创建 12G 的 Swap 文件
          sudo fallocate -l 12G $BIG_SPACE/swapfile || sudo dd if=/dev/zero of=$BIG_SPACE/swapfile bs=1M count=12288
          sudo chmod 600 $BIG_SPACE/swapfile
          sudo mkswap $BIG_SPACE/swapfile
          sudo swapon $BIG_SPACE/swapfile
          free -h

      # 3. 安装依赖 (修复 TeX 报错的关键步骤)
      - name: 安装基础编译依赖
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ack antlr3 autoconf automake autopoint binutils bison build-essential \
            bzip2 ccache clang cmake cpio curl device-tree-compiler fastjar flex gawk \
            gettext gcc-multilib g++-multilib git gnutls-dev gperf haveged help2man intltool \
            libelf-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev \
            libncurses-dev libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev \
            libz-dev lld llvm lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-pyelftools python3-setuptools qemu-utils re2c rsync \
            scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xxd zstd

          # 清理可能存在的残留
          sudo apt-get clean
          sudo userdel -r builder 2>/dev/null || true

      # 4. 克隆源码 & 处理 Feeds
      - name: Clone ImmortalWrt Source
        run: |
          cd /home/runner/work/openwrt_build
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt
          cd openwrt
          ./scripts/feeds update -a
          
          # 【去重】移除自带包
          rm -rf feeds/luci/applications/luci-app-openclash feeds/packages/net/openclash
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          rm -rf feeds/luci/applications/luci-app-passwall
          
          ./scripts/feeds install -a

      # 5. 克隆插件 (保持你的逻辑)
      - name: 克隆自定义插件
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          function clone_repo() {
            git clone --depth=1 -b "${3:-main}" "$1" "$2" || (sleep 5 && git clone --depth=1 -b "${3:-main}" "$1" "$2")
          }
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" "package/passwall-packages"
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall.git" "package/passwall-luci"
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall2" "package/passwall2-luci"
          clone_repo "https://github.com/vernesong/OpenClash.git" "package/luci-app-openclash" "master"
          clone_repo "https://github.com/sirpdboy/luci-app-lucky.git" "package/lucky"
          
          # 替换 Golang
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang

      # 6. 核心补丁：Rust & Python 环境预设
      - name: Apply Fixes (Rust & Python)
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          
          # 【1】修正 Curl 配置，确保下载大文件（Rust 源码）不中断
          echo "retry = 5" > ~/.curlrc
          echo "connect-timeout = 30" >> ~/.curlrc
          
          # 【2】强行关闭 LLVM 下载，防止网络 404
          find feeds/packages/lang/rust -name "Makefile" -exec sed -i 's/download-ci-llvm=true/download-ci-llvm=false/g' {} +
          
          # 【3】全局禁用 Cargo 校验（环境变量层面的双保险）
          mkdir -p ~/.cargo
          echo -e '[net]\nretry = 5\n[build]\nrustflags = ["-C", "link-arg=-s"]' > ~/.cargo/config.toml
          # 告诉系统，即使 checksum 错了也不要停
          echo "CARGO_CHECKSUM_INVALID_MODALITIES=1" >> $GITHUB_ENV

          # 【4】修复 Python 宿主依赖（OpenWrt 24.10 常规修复）
          find feeds/packages -name Makefile -exec sed -i 's/python3-setuptools\/host/python3\/host/g' {} +

      # 7. 载入配置 & 下载
      - name: Load Config & Download
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          SELECTED_CONFIG="${{ github.event.inputs.config_file }}"
          echo "MY_CONFIG_NAME=$SELECTED_CONFIG" >> $GITHUB_ENV
          cp $GITHUB_WORKSPACE/$SELECTED_CONFIG .config
          
          make defconfig
          
          # 清理下载缓存，确保 Rust 源码包是新鲜的
          rm -rf dl/rustc/*
          make download -j$(nproc)

      # 8. 编译 Host-Rust (暴力删除校验文件版)
      - name: Compile Host-Rust (Hard Fix)
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          
          # 1. 触发一次 Prepare，让它把源码解压出来
          make package/feeds/packages/rust/host/prepare -j$(nproc)
          
          # 2. 【核心操作】进入解压后的源码目录，物理删除所有校验信息
          # 只要没有 .cargo-checksum.json，Cargo 就不会去检查少了哪个文件
          echo "Removing all vendor checksums..."
          find build_dir/host/rustc-1.90.0-src/vendor -name ".cargo-checksum.json" -delete || true
          
          # 3. 再次确保禁用 Makefile 里的校验函数 (以防万一)
          sed -i 's/$(call ValidateRustVendor)/true/g' feeds/packages/lang/rust/Makefile || true
          sed -i 's/ValidateCargoVendor/true/g' feeds/packages/lang/rust/Makefile || true

          # 4. 正式开始编译
          make package/feeds/packages/rust/host/compile -j1 V=s

      # 9. 编译全量固件
      - name: Compile Firmware
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          echo "Rust 编译成功，开始全量编译..."
          make -j$(nproc) || make -j1 V=s

      # 10. 整理输出
      - name: Organize Files
        if: always()
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware-out
          cd /home/runner/work/openwrt_build/openwrt/bin/targets/mediatek/filogic/
          cp -f *.bin $GITHUB_WORKSPACE/firmware-out/ || true
          cp -f /home/runner/work/openwrt_build/openwrt/.config $GITHUB_WORKSPACE/firmware-out/${{ env.MY_CONFIG_NAME }}

      # 11. 上传 Release
      - name: Upload Release
        uses: softprops/action-gh-release@v1
        if: success()
        with:
          tag_name: immortalwrt-$(date +'%Y%m%d-%H%M')
          name: "RAX3000M 固件 [${{ env.MY_CONFIG_NAME }}]"
          body: |
            编译时间: ${{ steps.date.outputs.date }}
            源码: ImmortalWrt-24.10
            Rust 修复: Applied (Local Build + Clean Vendor)
          files: ${{ github.workspace }}/firmware-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
