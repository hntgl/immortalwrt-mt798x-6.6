name: Immortalwrt-24.10-6.6 插件选择版RAX3000M固件编译

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      config_file:
        description: '请选择要使用的配置文件 (.config)'
        required: true
        default: '24.10-6.6-passwall.config'
        type: choice
        options:
          - '24.10-6.6-passwall+openclash.config'
          - '24.10-6.6-passwall2.config'
          - '24.10-6.6-passwall&openclash.config'
          - '24.10-6.6-passwall.config'
          - '24.10-6.6-openclash.config'
          - '24.10-6.6-openclash-test.config'
          - '24.10-6.6-openclash-ksmbd.config'
          - '24.10-6.6-openclash+passwall-ksmbd.config'
          - '24.10-6.6-openclash+passwall2-ksmbd.config'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Workflow Repo
        uses: actions/checkout@v4

      - name: 极限清理系统环境 (Extreme Cleanup)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/powershell /usr/share/swift /usr/local/.ghcup
          sudo apt-get clean

      - name: 清理磁盘空间并重新挂载大分区
        uses: easimon/maximize-build-space@master
        with:
          build-mount-path: /home/runner/work/openwrt_build
          root-reserve-mb: 5120
          swap-size-mb: 1
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: 配置虚拟内存 (Enable 4GB Swap) 与 TMP 重定向
        run: |
          SWAP_DIR="/home/runner/work/openwrt_build"
          sudo fallocate -l 4G $SWAP_DIR/swapfile || sudo dd if=/dev/zero of=$SWAP_DIR/swapfile bs=1M count=4096
          sudo chmod 600 $SWAP_DIR/swapfile
          sudo mkswap $SWAP_DIR/swapfile
          sudo swapon $SWAP_DIR/swapfile
          # 将编译临时目录指向大分区
          sudo mkdir -p $SWAP_DIR/tmp
          sudo chmod 1777 $SWAP_DIR/tmp
          sudo mv /tmp /tmp_old && sudo ln -s $SWAP_DIR/tmp /tmp
          free -h

      - name: Install Dependencies & Toolchain fix
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # 1. 基础清理与重定向 (沿用之前的优化)
          BIG_SPACE="/home/runner/work/openwrt_build"
          sudo mkdir -p $BIG_SPACE/tmp $BIG_SPACE/apt_cache/archives
          sudo mv /tmp /tmp_old && sudo ln -s $BIG_SPACE/tmp /tmp
          sudo mv /var/cache/apt/archives /var/cache/apt/archives_old && sudo ln -s $BIG_SPACE/apt_cache/archives /var/cache/apt/archives
          
          sudo apt-get update
          # 2. 增加 python3-setuptools 和更多构建工具
          sudo apt-get install -y --no-install-recommends \
            clang llvm lld pkg-config libssl-dev libelf-dev zlib1g-dev \
            build-essential cmake bash curl python3-setuptools python3-dev \
            python3-pip python3-ply python3-pyelftools
            
          # 3. 安装 Rust 工具链并使其全局可见
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Clone ImmortalWrt Source
        run: |
          cd /home/runner/work/openwrt_build
          export GIT_TERMINAL_PROMPT=0
          
          # 1. 克隆主源码
          git clone -b openwrt-24.10-6.6 --single-branch --filter=blob:none https://github.com/padavanonly/immortalwrt-mt798x-24.10 openwrt
          cd openwrt
          
          # 2. 更新基础 Feeds
          ./scripts/feeds update -a
          
          # 3. 【核心优化】清理自带的旧包，防止冲突
          # 移除 OpenClash 旧版
          rm -rf feeds/luci/applications/luci-app-openclash
          rm -rf feeds/packages/net/openclash
          
          # 移除 Passwall 核心依赖旧版
          rm -rf feeds/packages/net/{xray-core,v2ray-geodata,sing-box,chinadns-ng,dns2socks,hysteria,ipt2socks,microsocks,naiveproxy,shadowsocks-libev,shadowsocks-rust,shadowsocksr-libev,simple-obfs,tcping,trojan-plus,tuic-client,v2ray-plugin,xray-plugin,geoview,shadow-tls}
          
          # 移除 Passwall LuCI 旧版
          rm -rf feeds/luci/applications/luci-app-passwall
          
          # 4. 安装 Feeds（此时 Feeds 里已经没有上述旧包了）
          ./scripts/feeds install -a

          # 5. 克隆最新版插件到 package 目录（拥有最高优先级）
          function clone_repo() {
            local url=$1; local path=$2; local branch=${3:-main}
            for i in {1..3}; do
              git clone --depth=1 -b "$branch" "$url" "$path" && return 0 || sleep 5
            done
            return 1
          }

          echo "正在下载最新插件..."
          # 使用官方组织 Openwrt-Passwall 的地址
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall-packages.git" "package/passwall-packages" "main"
          clone_repo "https://github.com/Openwrt-Passwall/openwrt-passwall.git" "package/passwall-luci" "main"
          
          # OpenClash 和 Lucky
          clone_repo "https://github.com/vernesong/OpenClash.git" "package/luci-app-openclash" "master"
          clone_repo "https://github.com/sirpdboy/luci-app-lucky.git" "package/lucky" "main" || clone_repo "https://github.com/sirpdboy/luci-app-lucky.git" "package/lucky" "master"
          
          # 修复 Golang 版本 (很多新插件需要 go 1.23+)
          rm -rf feeds/packages/lang/golang
          git clone https://github.com/kenzok8/golang -b 1.25 feeds/packages/lang/golang

          # 修复 python-setuptools/host 依赖警告
          sed -i 's/python-setuptools\/host/python3-setuptools\/host/g' feeds/packages/lang/python/python3/Makefile 2>/dev/null || true
          # 针对 python-pika 的专项修复
          find feeds/packages -name Makefile -exec sed -i 's/python-setuptools\/host//g' {} +

      - name: Apply Custom .config & Fix Downloads
        run: |
          SELECTED_CONFIG="${{ github.event.inputs.config_file || '24.10-6.6-passwall.config' }}"
          echo "MY_CONFIG_NAME=$SELECTED_CONFIG" >> $GITHUB_ENV
          cp $GITHUB_WORKSPACE/$SELECTED_CONFIG /home/runner/work/openwrt_build/openwrt/.config
          cd /home/runner/work/openwrt_build/openwrt
          
          # 修复 libxcrypt 报错并跳过 ebtables 校验
          sed -i '/^include \$(INCLUDE_DIR)\/package.mk/a TARGET_CFLAGS += -Wno-error=format-nonliteral' feeds/packages/libs/libxcrypt/Makefile
          sed -i 's/PKG_HASH:=.*/PKG_HASH:=skip/g' package/network/utils/ebtables/Makefile || true
          
          make defconfig
          # 循环重试下载
          for i in {1..3}; do
            make -j$(nproc) download && break || sleep 5
          done

      - name: Build Toolchain
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          make toolchain/install -j$(nproc)

      - name: Start Build
        run: |
          cd /home/runner/work/openwrt_build/openwrt
          make -j$(nproc) || make -j1 V=s

      - name: Package Firmware
        run: |
          mkdir -p $GITHUB_WORKSPACE/firmware-out
          cd /home/runner/work/openwrt_build/openwrt/bin/targets/mediatek/filogic/
          find . -maxdepth 1 -type f -exec cp {} $GITHUB_WORKSPACE/firmware-out/ \;
          cp /home/runner/work/openwrt_build/openwrt/.config $GITHUB_WORKSPACE/firmware-out/${{ env.MY_CONFIG_NAME }}

      - name: Generate Tag
        id: tag
        run: echo "tag=immortalwrt-$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

      - name: Upload Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: "RAX3000M [${{ env.MY_CONFIG_NAME }}] - ${{ steps.tag.outputs.tag }}"
          body: |
            基于 Padavanonly/ImmortalWrt-mt798x-24.10-6.6 编译
            配置文件: ${{ env.MY_CONFIG_NAME }}
          files: ${{ github.workspace }}/firmware-out/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
